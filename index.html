<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林庚憲-SDGs 性別平權 - 第一關</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            user-select: none;
            background-color: #2d5a27;
        }

        /* 遊戲地圖背景紋理與裝飾 */
        .village-map {
            background-color: #7ec850;
            background-image: 
                radial-gradient(#6eb841 15%, transparent 16%),
                radial-gradient(#8cd95d 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            position: relative;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.2);
        }

        /* 泥土小路樣式 */
        .path-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 茅草屋懸浮與動畫效果 */
        .hut-container {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .hut-container:hover {
            transform: scale(1.12) translateY(-6px);
            filter: drop-shadow(0 12px 8px rgba(0,0,0,0.3));
        }

        /* 茅草屋晃動動畫 */
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .hut-unanswered {
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        /* 完成狀態視覺 */
        .hut-completed .hut-body {
            filter: brightness(0.85);
        }

        /* 彈窗登場動畫 */
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f59e0b;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <!-- 【頁面佈局與標題欄】 -->
    <header class="bg-amber-800 text-white px-4 md:px-8 py-3 flex justify-between items-center z-20 shadow-lg border-b-4 border-amber-950">
        <!-- 左上角標題 -->
        <div class="flex items-center space-x-3">
            <div class="bg-pink-500 p-2 rounded-xl text-white shadow-md">
                <i class="fa-solid font-bold text-xl md:text-2xl fa-venus-mars"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-2xl font-black tracking-wide text-amber-100 drop-shadow">
                    林庚憲-SDGs 性別平權
                </h1>
                <p class="text-xs md:text-sm text-amber-200 font-medium">第一關：平權探索村莊</p>
            </div>
        </div>

        <!-- 右上角狀態列 -->
        <div class="flex items-center space-x-3 md:space-x-6">
            <!-- 進度計數器 -->
            <div class="bg-amber-950/60 px-4 py-2 rounded-2xl border border-amber-600/50 flex items-center space-x-3 shadow-inner">
                <i class="fa-solid fa-trophy text-yellow-400 text-lg md:text-xl animate-bounce"></i>
                <div>
                    <div class="text-xs text-amber-200">答對題數</div>
                    <div class="text-lg md:text-xl font-black text-yellow-300 tracking-wider">
                        <span id="score-text">0</span> / 10
                    </div>
                </div>
            </div>

            <!-- 完成度進度條 -->
            <div class="hidden sm:block w-32 md:w-48 bg-amber-950 rounded-full h-4 p-0.5 border border-amber-600">
                <div id="progress-bar" class="bg-gradient-to-r from-yellow-400 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <!-- 【遊戲地圖區域】 -->
    <main class="flex-1 relative village-map overflow-hidden flex items-center justify-center p-2 sm:p-4">
        
        <!-- SVG 小路背景 -->
        <svg class="path-svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
            <!-- S 型與環形鄉間小路 -->
            <path d="M 100 120 Q 250 80 400 150 T 700 120 T 900 220 T 750 420 T 450 480 T 150 400 Z" 
                  fill="none" stroke="#d4a373" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
            <path d="M 100 120 Q 250 80 400 150 T 700 120 T 900 220 T 750 420 T 450 480 T 150 400 Z" 
                  fill="none" stroke="#faedcd" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="8 6"/>
            
            <!-- 村莊裝飾與河流 -->
            <path d="M 0 300 Q 200 350 400 280 T 800 350 T 1000 300" 
                  fill="none" stroke="#60a5fa" stroke-width="18" opacity="0.6"/>
        </svg>

        <!-- 地圖自然與環境裝飾元素 -->
        <div id="decorations-layer" class="absolute inset-0 pointer-events-none">
            <!-- 樹木與花草裝飾由 JS 自動化放置或靜態標註 -->
        </div>

        <!-- 10 座茅草屋動態容器 -->
        <div id="huts-container" class="relative w-full h-full max-w-5xl max-h-[650px]">
            <!-- 茅草屋由 JavaScript 根據座標動態渲染 -->
        </div>

    </main>

    <!-- 【問答 Modal 彈窗】 -->
    <div id="question-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-amber-50 border-4 border-amber-800 rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden modal-animate">
            
            <!-- Modal 頂欄 -->
            <div class="bg-amber-800 text-amber-100 px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span id="modal-hut-tag" class="bg-amber-600 text-white text-xs px-3 py-1 rounded-full font-bold">1號茅草屋</span>
                    <h3 class="font-bold text-lg text-yellow-300">SDGs 5 性別平權挑戰</h3>
                </div>
                <button onclick="closeModal()" class="text-amber-200 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>

            <!-- 題目內容 -->
            <div class="p-6">
                <div class="mb-4">
                    <span class="text-xs font-bold text-pink-600 uppercase tracking-wider">Question</span>
                    <h2 id="modal-question-text" class="text-lg md:text-xl font-bold text-gray-800 mt-1 leading-relaxed">
                        題目載入中...
                    </h2>
                </div>

                <!-- 選項清單 -->
                <div id="modal-options-container" class="space-y-3 mb-4">
                    <!-- 選項將由 JS 動態生成 -->
                </div>

                <!-- 回饋與解析區塊 -->
                <div id="feedback-box" class="hidden p-4 rounded-2xl mb-2 text-sm leading-relaxed">
                    <div id="feedback-result" class="font-bold text-base mb-1 flex items-center gap-2"></div>
                    <div id="feedback-explanation" class="text-gray-700"></div>
                </div>
            </div>

            <!-- Modal 底欄 -->
            <div class="bg-amber-100/80 px-6 py-3 border-t border-amber-200 flex justify-end">
                <button id="modal-next-btn" onclick="closeModal()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl shadow-md transition transform active:scale-95">
                    確認並繼續 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 【關卡結算 Modal 彈窗】 -->
    <div id="result-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border-4 rounded-3xl shadow-2xl max-w-md w-full p-6 text-center modal-animate relative overflow-hidden" id="result-card">
            
            <!-- 裝飾背景圖騰 -->
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-yellow-200 rounded-full opacity-50 blur-xl"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-pink-200 rounded-full opacity-50 blur-xl"></div>

            <!-- 成就圖示 -->
            <div id="result-icon-container" class="w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center shadow-lg text-5xl">
                <!-- 圖示動態替換 -->
            </div>

            <h2 id="result-title" class="text-2xl md:text-3xl font-black mb-2 text-gray-800">
                探索完成！
            </h2>

            <p id="result-subtitle" class="text-gray-600 mb-6 text-sm md:text-base leading-relaxed px-2">
                結算資訊讀取中...
            </p>

            <!-- 得分統計卡片 -->
            <div class="bg-amber-50 rounded-2xl p-4 mb-6 border border-amber-200 flex justify-around items-center">
                <div>
                    <div class="text-xs text-gray-500 font-bold">總答題數</div>
                    <div class="text-2xl font-black text-gray-800">10</div>
                </div>
                <div class="h-8 w-px bg-amber-300"></div>
                <div>
                    <div class="text-xs text-gray-500 font-bold">答對題數</div>
                    <div id="result-score" class="text-3xl font-black text-emerald-600">0</div>
                </div>
                <div class="h-8 w-px bg-amber-300"></div>
                <div>
                    <div class="text-xs text-gray-500 font-bold">通關門檻</div>
                    <div class="text-2xl font-black text-amber-700">8 題</div>
                </div>
            </div>

            <!-- 操作按鈕 -->
            <div id="result-action-container" class="space-y-3">
                <!-- 按鈕動態渲染 -->
            </div>
        </div>
    </div>

    <!-- 腳本區域 -->
    <script>
        // 【10 題 SDGs 5 性別平權題目資料】
        const questionsData = [
            {
                id: 1,
                question: "聯合國永續發展目標 (SDGs) 中，關於「實現性別平等，增進所有婦女女性賦權」是哪一個目標？",
                options: ["SDG 3 健康與福祉", "SDG 5 性別平權", "SDG 8 良好工作與經濟成長", "SDG 10 減少不平等"],
                answer: 1,
                explanation: "SDG 5 專注於消除對婦女和女童的一切形式歧視與暴力，推動完整的性別平權。"
            },
            {
                id: 2,
                question: "關於「家務勞動與照顧家人」的分配，下列何者才是符合現代性別平權的觀念？",
                options: ["家務應該完全由女性承擔", "男性只需要負責在外賺錢，不必做家務", "家務與照顧責任應由家庭成員共同分擔與溝通", "家務是年長者的事情"],
                answer: 2,
                explanation: "打破傳統「男主外、女主內」刻板印象，共同分擔家務是實現家庭性別平等的關鍵。"
            },
            {
                id: 3,
                question: "「同工同酬」是指在相同工作內容、相同績效下，員工獲得的薪資待遇應該如何？",
                options: ["男性應獲得較高薪資", "女性應獲得較高薪資", "不分性別，應獲得相同的報酬與薪水", "視年齡決定薪資"],
                answer: 2,
                explanation: "同工同酬保障所有人不因性別差異而在職場薪酬上受到歧視。"
            },
            {
                id: 4,
                question: "選擇職業時，例如「護理師」或「工程師」，應該依據什麼來決定？",
                options: ["個人的興趣、能力與專業性", "傳統社會對男女性別的指定", "父母與親友的強烈要求", "該職業的男女性別比例"],
                answer: 0,
                explanation: "職業不分性別，每個人都有權利根據自己的興趣與能力自由選擇職涯方向。"
            },
            {
                id: 5,
                question: "下列哪一種行為屬於打破性別刻板印象的表現？",
                options: ["認為男生哭泣就是軟弱的表現", "鼓勵女孩學習 STEM（科學、技術、工程、數學）領域", "限制男孩玩芭比娃娃", "認為只有女性適合擔任幼兒園教師"],
                answer: 1,
                explanation: "鼓勵女性進入傳統上由男性主導的 STEM 領域，有助於突破性別邊界與刻板印象。"
            },
            {
                id: 6,
                question: "當我們看見有人因性別特質或性傾向受到欺凌或嘲笑時，合理的做法是什麼？",
                options: ["加入嘲笑的行列", "冷眼旁觀，不關自己的事", "勇敢表達制止，並向權責單位或師長反映尋求協助", "幫忙散播相關的不當言論"],
                answer: 2,
                explanation: "營造友善且尊重的環境需要大家的共同維護，主動協助對抗性別霸凌。"
            },
            {
                id: 7,
                question: "「育嬰假（產假與陪產檢及陪產假）」在性別平權推動下的適給對象是誰？",
                options: ["只有女性員工可以申請", "只有男性員工可以申請", "雙親（父親與母親）皆有權利申請與陪伴新生兒", "只有高階主管可以申請"],
                answer: 2,
                explanation: "現代性別平權法規推動雙親皆可享有育嬰與照顧假期，促進共同撫育責任。"
            },
            {
                id: 8,
                question: "推動「婦女與女性參與公共決策與政界治理」，主要有什麼積極效益？",
                options: ["能讓政策制定更具多元觀點與全面性", "會導致會議討論效率降低", "僅對女性團體有益處", "對社會發展沒有顯著影響"],
                answer: 0,
                explanation: "女性參與決策層能帶來多元視角，促進更公平且包容的社會政策。"
            },
            {
                id: 9,
                question: "玩具製造商推出「不分性別」的中性顏色包裝與多元玩具款式，目的為何？",
                options: ["節省生產成本", "避免限制孩子的潛能發展與想像力", "單純為了流行好看", "減少玩具的銷量"],
                answer: 1,
                explanation: "不以性別限制玩具類型，能讓孩子在成長過程中自由探索興趣，不受性別框架束縛。"
            },
            {
                id: 10,
                question: "什麼是「情感教育」與「身體自主權」的核心精神？",
                options: ["尊重他人的個人意願與身體界線，學習健康溝通", "可以未經同意任意觸碰他人", "只要自己喜歡就可以強加意願於他人", "忽視他人的拒絕與感受"],
                answer: 0,
                explanation: "身體自主權與相互尊重是性別平等教育不可或缺的重要基石。"
            }
        ];

        // 茅草屋在地圖上的相對百分比座標 (X%, Y%)
        const hutPositions = [
            { top: '15%', left: '12%' },
            { top: '10%', left: '42%' },
            { top: '15%', left: '72%' },
            { top: '35%', left: '84%' },
            { top: '65%', left: '78%' },
            { top: '75%', left: '48%' },
            { top: '70%', left: '18%' },
            { top: '45%', left: '10%' },
            { top: '40%', left: '38%' },
            { top: '42%', left: '60%' }
        ];

        // 狀態管理
        let userAnswers = new Array(10).fill(null); // 紀錄回答歷史 null/true/false
        let score = 0;
        let activeHutIndex = null;

        // 初始化
        window.onload = function() {
            renderMapDecorations();
            renderHuts();
            updateScoreUI();
        };

        // 繪製裝飾物（樹木與花草）
        function renderMapDecorations() {
            const container = document.getElementById('decorations-layer');
            const treesPos = [
                { top: '5%', left: '5%' }, { top: '80%', left: '8%' },
                { top: '5%', left: '90%' }, { top: '85%', left: '90%' },
                { top: '25%', left: '28%' }, { top: '55%', left: '68%' },
                { top: '88%', left: '35%' }, { top: '2%', left: '60%' }
            ];

            treesPos.forEach(pos => {
                const tree = document.createElement('div');
                tree.className = 'absolute text-emerald-800 opacity-80 pointer-events-none transform -translate-x-1/2 -translate-y-1/2';
                tree.style.top = pos.top;
                tree.style.left = pos.left;
                tree.innerHTML = `<i class="fa-solid fa-tree text-3xl sm:text-4xl text-emerald-700 filter drop-shadow"></i>`;
                container.appendChild(tree);
            });
        }

        // 渲染 10 座茅草屋
        function renderHuts() {
            const container = document.getElementById('huts-container');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const pos = hutPositions[index];
                const isAnswered = userAnswers[index] !== null;
                const isCorrect = userAnswers[index] === true;

                const hutEl = document.createElement('div');
                hutEl.className = `absolute hut-container transform -translate-x-1/2 -translate-y-1/2 ${isAnswered ? 'hut-completed' : 'hut-unanswered'}`;
                hutEl.style.top = pos.top;
                hutEl.style.left = pos.left;
                hutEl.onclick = () => openModal(index);

                // SVG 茅草屋外觀
                hutEl.innerHTML = `
                    <div class="relative flex flex-col items-center group">
                        <!-- 門牌與編號標籤 -->
                        <div class="bg-amber-900 text-yellow-300 font-black text-xs sm:text-sm px-2.5 py-0.5 rounded-full border border-yellow-500 shadow-md mb-1 z-10 flex items-center gap-1">
                            <span>#${index + 1}</span>
                            ${isAnswered ? (isCorrect ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : '<i class="fa-solid fa-circle-xmark text-rose-400"></i>') : ''}
                        </div>

                        <!-- 茅草屋主體圖示 (SVG 手繪質感) -->
                        <div class="hut-body relative w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center">
                            <!-- 屋頂燈光指示 -->
                            ${isAnswered ? '<div class="absolute -top-1 w-4 h-4 bg-yellow-300 rounded-full blur-sm animate-pulse"></div>' : ''}
                            
                            <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-lg">
                                <!-- 屋頂 (茅草) -->
                                <path d="M 50 10 L 90 45 L 10 45 Z" fill="#d97706" stroke="#78350f" stroke-width="4" stroke-linejoin="round"/>
                                <path d="M 50 15 L 82 42 L 18 42 Z" fill="#f59e0b" />
                                <path d="M 30 25 L 35 42 M 50 18 L 50 42 M 70 25 L 65 42" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
                                
                                <!-- 主體牆壁 -->
                                <rect x="20" y="44" width="60" height="46" rx="4" fill="#fef3c7" stroke="#78350f" stroke-width="4"/>
                                
                                <!-- 木門 -->
                                <rect x="40" y="58" width="20" height="32" rx="2" fill="${isAnswered ? '#fde047' : '#92400e'}" stroke="#451a03" stroke-width="2"/>
                                <circle cx="45" cy="74" r="2" fill="#f59e0b"/>

                                <!-- 窗戶 -->
                                <rect x="26" y="54" width="10" height="10" rx="1" fill="${isAnswered ? '#fef08a' : '#78350f'}" />
                                <rect x="64" y="54" width="10" height="10" rx="1" fill="${isAnswered ? '#fef08a' : '#78350f'}" />
                            </svg>
                        </div>

                        <!-- 狀態浮動提示標籤 -->
                        <div class="mt-1 text-[11px] font-bold px-2 py-0.5 rounded-md shadow ${isAnswered ? 'bg-gray-800 text-gray-200' : 'bg-white text-amber-900 border border-amber-300'}">
                            ${isAnswered ? '已探索' : '點擊挑戰'}
                        </div>
                    </div>
                `;
                container.appendChild(hutEl);
            });
        }

        // 開啟題目 Modal
        function openModal(index) {
            activeHutIndex = index;
            const qData = questionsData[index];

            document.getElementById('modal-hut-tag').innerText = `第 ${index + 1} 號茅草屋`;
            document.getElementById('modal-question-text').innerText = qData.question;
            
            // 重置回饋區與按鈕
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.className = 'hidden p-4 rounded-2xl mb-2 text-sm leading-relaxed';
            document.getElementById('modal-next-btn').classList.add('hidden');

            // 渲染選項
            const optionsContainer = document.getElementById('modal-options-container');
            optionsContainer.innerHTML = '';

            const isAlreadyAnswered = userAnswers[index] !== null;

            qData.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3.5 rounded-xl border-2 font-medium transition-all flex items-center justify-between ${
                    isAlreadyAnswered 
                        ? 'cursor-not-allowed opacity-70 border-gray-200 bg-gray-50' 
                        : 'border-amber-200 bg-white hover:border-amber-500 hover:bg-amber-50 active:scale-[0.99]'
                }`;
                
                btn.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 rounded-full bg-amber-100 text-amber-800 font-bold flex items-center justify-center text-sm border border-amber-300 flex-shrink-0">
                            ${String.fromCharCode(65 + optIdx)}
                        </span>
                        <span class="text-gray-800 text-sm md:text-base">${optText}</span>
                    </div>
                    <i class="fa-regular fa-circle text-gray-300 opt-icon"></i>
                `;

                if (!isAlreadyAnswered) {
                    btn.onclick = () => handleSelectOption(optIdx, qData.answer);
                }

                optionsContainer.appendChild(btn);
            });

            // 若先前已回答過，顯示歷史紀錄與解析
            if (isAlreadyAnswered) {
                showFeedback(userAnswers[index], qData.answer, qData.explanation, false);
            }

            document.getElementById('question-modal').classList.remove('hidden');
        }

        // 選擇答案處理
        function handleSelectOption(selectedIndex, correctIndex) {
            const isCorrect = selectedIndex === correctIndex;
            
            // 記錄答案（僅首次回答計算分數）
            if (userAnswers[activeHutIndex] === null) {
                userAnswers[activeHutIndex] = isCorrect;
                if (isCorrect) score++;
                updateScoreUI();
                renderHuts();
            }

            // 鎖定所有選項按鈕樣式
            const optionsContainer = document.getElementById('modal-options-container');
            const buttons = optionsContainer.querySelectorAll('button');

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-amber-500', 'hover:bg-amber-50');
                
                if (idx === correctIndex) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900');
                    btn.querySelector('.opt-icon').className = 'fa-solid fa-circle-check text-emerald-600 text-xl';
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-900');
                    btn.querySelector('.opt-icon').className = 'fa-solid fa-circle-xmark text-rose-600 text-xl';
                }
            });

            // 顯示即時解析
            showFeedback(isCorrect, correctIndex, questionsData[activeHutIndex].explanation, true);
        }

        // 顯示答案解析回饋
        function showFeedback(isCorrect, correctIndex, explanationText, isFirstTime) {
            const feedbackBox = document.getElementById('feedback-box');
            const resultEl = document.getElementById('feedback-result');
            const expEl = document.getElementById('feedback-explanation');
            const nextBtn = document.getElementById('modal-next-btn');

            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                feedbackBox.className = 'p-4 rounded-2xl mb-2 text-sm leading-relaxed bg-emerald-100/80 border border-emerald-300 text-emerald-950';
                resultEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i> 答對了！非常優秀！`;
            } else {
                feedbackBox.className = 'p-4 rounded-2xl mb-2 text-sm leading-relaxed bg-rose-100/80 border border-rose-300 text-rose-950';
                resultEl.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600 text-xl"></i> 答錯了！再接再厲！`;
            }

            expEl.innerHTML = `<strong>【解析】</strong> ${explanationText}`;
            nextBtn.classList.remove('hidden');
        }

        // 關閉問答 Modal 並檢查是否全部答完
        function closeModal() {
            document.getElementById('question-modal').classList.add('hidden');

            // 檢查是否所有 10 題皆已作答
            const totalAnswered = userAnswers.filter(a => a !== null).length;
            if (totalAnswered === 10) {
                setTimeout(showResultModal, 400);
            }
        }

        // 更新頂部得分與進度條 UI
        function updateScoreUI() {
            document.getElementById('score-text').innerText = score;
            const totalAnswered = userAnswers.filter(a => a !== null).length;
            const progressPercent = (totalAnswered / 10) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }

        // 【關卡結算邏輯】
        function showResultModal() {
            const resultModal = document.getElementById('result-modal');
            const resultCard = document.getElementById('result-card');
            const iconContainer = document.getElementById('result-icon-container');
            const titleEl = document.getElementById('result-title');
            const subtitleEl = document.getElementById('result-subtitle');
            const scoreEl = document.getElementById('result-score');
            const actionContainer = document.getElementById('result-action-container');

            scoreEl.innerText = score;

            // 評判標準：答對 >= 8 題通關，< 8 題重來
            if (score >= 8) {
                // 通關成功
                resultCard.className = "bg-white border-4 border-emerald-500 rounded-3xl shadow-2xl max-w-md w-full p-6 text-center modal-animate relative overflow-hidden";
                iconContainer.className = "w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center shadow-lg text-5xl bg-emerald-100 text-emerald-600 border-4 border-emerald-400";
                iconContainer.innerHTML = `<i class="fa-solid fa-trophy"></i>`;
                
                titleEl.innerText = "恭喜通關成功！";
                titleEl.className = "text-2xl md:text-3xl font-black mb-2 text-emerald-800";
                
                subtitleEl.innerText = "您展現了卓越的性別平權意識與知識！準備好迎接更高難度的挑戰了嗎？";
                
                actionContainer.innerHTML = `
                    <a href="level2.html" class="block w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black py-3.5 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center space-x-2">
                        <span>前往下一關</span>
                        <i class="fa-solid fa-circle-arrow-right"></i>
                    </a>
                `;
            } else {
                // 挑戰失敗
                resultCard.className = "bg-white border-4 border-rose-500 rounded-3xl shadow-2xl max-w-md w-full p-6 text-center modal-animate relative overflow-hidden";
                iconContainer.className = "w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center shadow-lg text-5xl bg-rose-100 text-rose-600 border-4 border-rose-400";
                iconContainer.innerHTML = `<i class="fa-solid fa-rotate-right"></i>`;
                
                titleEl.innerText = "挑戰失敗，再接再厲！";
                titleEl.className = "text-2xl md:text-3xl font-black mb-2 text-rose-800";
                
                subtitleEl.innerText = `答對題數未達 8 題門檻（當前答對 ${score} 題）。別灰心，重整旗鼓再來挑戰一次吧！`;
                
                actionContainer.innerHTML = `
                    <button onclick="location.reload()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-black py-3.5 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                        <span>重新挑戰</span>
                    </button>
                `;
            }

            resultModal.classList.remove('hidden');
        }
    </script>
</body>
</html>
