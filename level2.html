<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林庚憲-SDGs 性別平權-情境題</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 圓體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            user-select: none;
            background-color: #38bdf8;
            overflow: hidden;
        }

        /* 遊樂園背景天際線與地貌 */
        .park-bg {
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #86efac 50%, #4ade80 100%);
            position: relative;
        }

        /* 摩天輪旋轉動畫 */
        @keyframes ferrisWheelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .ferris-wheel-spin {
            animation: ferrisWheelSpin 40s linear infinite;
            transform-origin: center center;
        }

        /* 花朵晃動與懸浮效果 */
        @keyframes flowerBounce {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.1) translateY(-8px); }
        }
        .flower-icon {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: flowerBounce 2.5s infinite ease-in-out;
        }
        .flower-icon:hover {
            transform: scale(1.25) rotate(12deg);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));
        }

        /* 花朵完成狀態 */
        .flower-completed {
            filter: grayscale(0.4) opacity(0.85);
            animation: none !important;
        }

        /* 可拖曳卡片樣式 */
        .drag-card {
            touch-action: none;
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .drag-card:active {
            cursor: grabbing;
            transform: scale(1.03);
        }
        .drag-card.dragging {
            opacity: 0.5;
        }

        /* 放置放置目標區高亮 */
        .drop-zone {
            transition: all 0.2s ease;
        }
        .drop-zone.drag-over {
            background-color: rgba(254, 240, 138, 0.6);
            border-color: #eab308;
            transform: scale(1.02);
        }

        /* 彈窗動畫 */
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- 【頂部標題與狀態欄】 -->
    <header class="bg-indigo-900 text-white px-4 md:px-8 py-3 flex justify-between items-center z-20 shadow-lg border-b-4 border-indigo-950">
        <!-- 左上角標題（規格指定） -->
        <div class="flex items-center space-x-3">
            <div class="bg-purple-500 p-2 rounded-xl text-white shadow-md">
                <i class="fa-solid fa-ferris-wheel text-xl md:text-2xl"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-2xl font-black tracking-wide text-purple-100 drop-shadow">
                    林庚憲-SDGs 性別平權-情境題
                </h1>
                <p class="text-xs md:text-sm text-purple-200 font-medium">第二關：遊樂園情境歸類挑戰</p>
            </div>
        </div>

        <!-- 右上角答對題數顯示（規格指定） -->
        <div class="flex items-center space-x-3 md:space-x-6">
            <div class="bg-indigo-950/70 px-4 py-2 rounded-2xl border border-purple-500/40 flex items-center space-x-3 shadow-inner">
                <i class="fa-solid fa-star text-yellow-400 text-xl animate-spin" style="animation-duration: 8s;"></i>
                <div>
                    <div class="text-xs text-purple-200">答對題數</div>
                    <div class="text-lg md:text-xl font-black text-yellow-300 tracking-wider">
                        <span id="score-text">0</span> / 6
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 【遊樂園地圖場景】 -->
    <main class="flex-1 relative park-bg overflow-hidden flex flex-col justify-between">

        <!-- 背景遊樂園設施（SVG 手繪裝飾） -->
        <div class="absolute inset-0 pointer-events-none z-0">
            <!-- 遠景山丘與天空雲朵 -->
            <div class="absolute top-8 left-12 text-white/70 text-4xl"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute top-16 right-24 text-white/80 text-5xl"><i class="fa-solid fa-cloud"></i></div>

            <!-- 左側摩天輪 -->
            <div class="absolute top-10 left-6 sm:left-16 w-44 h-44 sm:w-64 sm:h-64 opacity-80">
                <svg viewBox="0 0 200 200" class="w-full h-full">
                    <!-- 支架 -->
                    <path d="M 100 100 L 60 190 M 100 100 L 140 190" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
                    <!-- 轉盤 (旋轉) -->
                    <g class="ferris-wheel-spin">
                        <circle cx="100" cy="100" r="70" fill="none" stroke="#ec4899" stroke-width="4"/>
                        <circle cx="100" cy="100" r="40" fill="none" stroke="#8b5cf6" stroke-width="3"/>
                        <!-- 連接輻條 -->
                        <line x1="100" y1="30" x2="100" y2="170" stroke="#f59e0b" stroke-width="3"/>
                        <line x1="30" y1="100" x2="170" y2="100" stroke="#f59e0b" stroke-width="3"/>
                        <line x1="50" y1="50" x2="150" y2="150" stroke="#f59e0b" stroke-width="3"/>
                        <line x1="50" y1="150" x2="150" y2="50" stroke="#f59e0b" stroke-width="3"/>
                        <!-- 車廂 -->
                        <circle cx="100" cy="30" r="8" fill="#3b82f6"/>
                        <circle cx="170" cy="100" r="8" fill="#10b981"/>
                        <circle cx="100" cy="170" r="8" fill="#f43f5e"/>
                        <circle cx="30" cy="100" r="8" fill="#eab308"/>
                        <circle cx="150" cy="50" r="8" fill="#a855f7"/>
                        <circle cx="50" cy="150" r="8" fill="#06b6d4"/>
                        <circle cx="150" cy="150" r="8" fill="#f97316"/>
                        <circle cx="50" cy="50" r="8" fill="#84cc16"/>
                    </g>
                    <!-- 中心軸 -->
                    <circle cx="100" cy="100" r="8" fill="#1e293b"/>
                </svg>
            </div>

            <!-- 右側雲霄飛車軌道與馬戲團帳篷 -->
            <div class="absolute top-16 right-4 sm:right-16 w-56 sm:w-80 h-40 opacity-75">
                <svg viewBox="0 0 300 150" class="w-full h-full">
                    <path d="M 0 130 Q 80 10 150 90 T 300 40" fill="none" stroke="#ef4444" stroke-width="5" stroke-dasharray="6 4"/>
                    <!-- 帳篷 -->
                    <polygon points="200,140 250,70 300,140" fill="#f43f5e"/>
                    <polygon points="200,140 225,70 250,140" fill="#ffffff"/>
                    <polygon points="275,140 287,105 300,140" fill="#ffffff"/>
                    <polygon points="245,70 250,50 255,70" fill="#eab308"/>
                </svg>
            </div>

            <!-- 草地標示線區分上下半部 -->
            <div class="absolute top-1/2 left-0 w-full text-center text-emerald-800/40 text-xs font-bold tracking-widest pt-2">
                ✿ 遊樂園花園探索區 (點擊花朵進入情境挑戰) ✿
            </div>
        </div>

        <!-- 上半部裝飾／資訊提示 -->
        <div class="relative z-10 p-4 text-center mt-2">
            <div class="inline-block bg-white/80 backdrop-blur-md px-6 py-2 rounded-full shadow-md border border-white/60">
                <span class="text-indigo-900 font-bold text-sm md:text-base">
                    <i class="fa-solid fa-circle-info text-pink-500 mr-1.5"></i>
                    地圖下半部隨機開著 3 朵花，每朵花藏有 2 個情境題目！
                </span>
            </div>
        </div>

        <!-- 【下半部隨機花朵放置區域】 (網頁下半部) -->
        <div id="flower-zone" class="relative z-10 h-1/2 w-full max-w-6xl mx-auto">
            <!-- 3 朵花將由 JavaScript 隨機計算位置並渲染 -->
        </div>

    </main>

    <!-- 【情境題組拖曳歸類 Modal 彈窗】 -->
    <div id="quiz-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 hidden">
        <div class="bg-emerald-50 border-4 border-emerald-700 rounded-3xl shadow-2xl max-w-3xl w-full max-h-[92vh] flex flex-col overflow-hidden modal-animate">
            
            <!-- Modal 標題欄 -->
            <div class="bg-emerald-700 text-white px-5 py-3.5 flex justify-between items-center flex-shrink-0">
                <div class="flex items-center space-x-2">
                    <span id="modal-flower-badge" class="bg-yellow-400 text-emerald-950 text-xs px-3 py-1 rounded-full font-black">1 號花朵</span>
                    <h3 class="font-bold text-base md:text-lg text-emerald-100">情境歸類挑戰（請將行為卡片放入正確框中）</h3>
                </div>
                <button onclick="closeQuizModal()" class="text-emerald-200 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>

            <!-- Modal 主要內容區 -->
            <div class="p-4 sm:p-6 flex-1 overflow-y-auto space-y-4">
                
                <!-- 提示說明 -->
                <p class="text-xs sm:text-sm text-emerald-900 bg-emerald-100/80 p-2.5 rounded-xl border border-emerald-300 flex items-center gap-2">
                    <i class="fa-solid fa-hand-pointer text-emerald-600 text-base"></i>
                    <span><strong>操作說明：</strong>按住卡片「拖曳」至目標框，或「點擊卡片」選擇分類框！</span>
                </p>

                <!-- 待歸類行為卡片區 (2 個題目) -->
                <div>
                    <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">待分類的情境行為卡片：</h4>
                    <div id="cards-source-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 min-h-[90px] p-2 bg-emerald-900/5 rounded-2xl border-2 border-dashed border-emerald-300">
                        <!-- 卡片由 JS 動態生成 -->
                    </div>
                </div>

                <!-- 拖曳放置目標區 (性別平等 vs 性別不平等) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                    
                    <!-- 綠色框：性別平等 -->
                    <div id="drop-zone-equal" data-target="equal" class="drop-zone bg-teal-50/90 border-3 border-teal-500 rounded-2xl p-3 flex flex-col min-h-[160px] shadow-sm">
                        <div class="flex items-center justify-between border-b-2 border-teal-200 pb-2 mb-2">
                            <span class="font-black text-teal-800 text-base flex items-center gap-1.5">
                                <i class="fa-solid fa-scale-balanced text-teal-600"></i> 性別平等
                            </span>
                            <span class="text-xs bg-teal-200 text-teal-900 font-bold px-2 py-0.5 rounded-full">平等框</span>
                        </div>
                        <div class="drop-card-slot flex-1 space-y-2 flex flex-col justify-start">
                            <!-- 放入此處的卡片 -->
                        </div>
                    </div>

                    <!-- 紅色框：性別不平等 -->
                    <div id="drop-zone-unequal" data-target="unequal" class="drop-zone bg-rose-50/90 border-3 border-rose-400 rounded-2xl p-3 flex flex-col min-h-[160px] shadow-sm">
                        <div class="flex items-center justify-between border-b-2 border-rose-200 pb-2 mb-2">
                            <span class="font-black text-rose-800 text-base flex items-center gap-1.5">
                                <i class="fa-solid fa-ban text-rose-500"></i> 性別不平等
                            </span>
                            <span class="text-xs bg-rose-200 text-rose-900 font-bold px-2 py-0.5 rounded-full">不平等框</span>
                        </div>
                        <div class="drop-card-slot flex-1 space-y-2 flex flex-col justify-start">
                            <!-- 放入此處的卡片 -->
                        </div>
                    </div>

                </div>

                <!-- 驗證結果與解析訊息 -->
                <div id="quiz-feedback" class="hidden p-3.5 rounded-2xl text-sm leading-relaxed">
                    <!-- 解析文字 -->
                </div>
            </div>

            <!-- Modal 底欄操作鈕 -->
            <div class="bg-emerald-100/90 px-5 py-3 border-t border-emerald-200 flex justify-between items-center flex-shrink-0">
                <button onclick="resetCurrentSetModal()" class="text-xs text-gray-600 hover:text-gray-900 font-bold underline">
                    重置本組擺放
                </button>
                <button id="submit-set-btn" onclick="checkCurrentSetAnswers()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-xl shadow-md transition transform active:scale-95">
                    提交本組解答 <i class="fa-solid fa-check ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 【結局等級 Modal 彈窗】 (正中間顯示，規格指定) -->
    <div id="endgame-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border-4 rounded-3xl shadow-2xl max-w-md w-full p-6 text-center modal-animate relative overflow-hidden" id="endgame-card">
            
            <!-- 背景光芒裝飾 -->
            <div class="absolute -top-16 -right-16 w-36 h-36 bg-yellow-200 rounded-full opacity-40 blur-2xl"></div>

            <!-- 徽章圖示 -->
            <div id="endgame-badge-icon" class="w-24 h-24 mx-auto mb-3 rounded-full flex items-center justify-center text-5xl shadow-md border-4">
                <!-- 動態注入 -->
            </div>

            <!-- 等級頭銜 (再加油 / 進步中 / 平權達人) -->
            <div class="text-xs font-black uppercase tracking-widest text-gray-400 mb-1">您的最終評價等級</div>
            <h2 id="endgame-level-title" class="text-3xl font-black mb-3">
                --
            </h2>

            <!-- 說明文字 -->
            <p id="endgame-description" class="text-gray-600 text-sm mb-6 leading-relaxed px-2">
                --
            </p>

            <!-- 得分圓形計分牌 -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 mb-6 flex justify-around items-center">
                <div>
                    <div class="text-xs text-indigo-400 font-bold">總題目數</div>
                    <div class="text-2xl font-black text-indigo-900">6</div>
                </div>
                <div class="h-8 w-px bg-indigo-200"></div>
                <div>
                    <div class="text-xs text-indigo-400 font-bold">答對題數</div>
                    <div id="endgame-score-val" class="text-3xl font-black text-indigo-600">0</div>
                </div>
            </div>

            <!-- 結局操作按鈕區（規格指定） -->
            <div id="endgame-action-area">
                <!-- 動態注入再次挑戰或下載證書按鈕 -->
            </div>
        </div>
    </div>

    <!-- 腳本區域 -->
    <script>
        // 【3 個題組，共 6 個情境行為題目】
        const flowerQuestionSets = [
            // 花朵 1 題組 (2 觀念)
            {
                id: 0,
                flowerColor: 'pink',
                flowerName: '粉紅百合',
                cards: [
                    {
                        id: 'q1',
                        text: '「爸爸與媽媽輪流下廚做飯、分擔掃地拖地等各項家務作業。」',
                        correctTarget: 'equal', // 性別平等
                        explanation: '家務分工不分男女，共同承擔家庭責任是「性別平等」的展現。'
                    },
                    {
                        id: 'q2',
                        text: '「公司認為女性員工未來可能生育，因此拒絕給予晉升主管的機會。」',
                        correctTarget: 'unequal', // 性別不平等
                        explanation: '以生育預測剝奪職涯升遷機會屬於歧視，是「性別不平等」。'
                    }
                ]
            },
            // 花朵 2 題組 (2 觀念)
            {
                id: 1,
                flowerColor: 'yellow',
                flowerName: '向日葵',
                cards: [
                    {
                        id: 'q3',
                        text: '「學校鼓勵男學生參加舞蹈社、女學生參加機器人與程式設計社團。」',
                        correctTarget: 'equal', // 性別平等
                        explanation: '尊重並鼓勵個人依興趣發展潛能，不設性別框架是「性別平等」。'
                    },
                    {
                        id: 'q4',
                        text: '「嘲笑班上性格溫柔害羞的男同學缺乏陽剛氣概、不夠像個男孩子。」',
                        correctTarget: 'unequal', // 性別不平等
                        explanation: '用刻板氣質規範並霸凌他人屬於性別偏見，是「性別不平等」。'
                    }
                ]
            },
            // 花朵 3 題組 (2 觀念)
            {
                id: 2,
                flowerColor: 'purple',
                flowerName: '薰衣草',
                cards: [
                    {
                        id: 'q5',
                        text: '「政府立法保障女性與男性享有相同天數與薪資待遇的育嬰假。」',
                        correctTarget: 'equal', // 性別平等
                        explanation: '提供平等的育嬰權益與制度保障，符合「性別平等」理念。'
                    },
                    {
                        id: 'q6',
                        text: '「面試官詢問女性求職者『預計何時結婚』，並作為是否錄取的條件。」',
                        correctTarget: 'unequal', // 性別不平等
                        explanation: '面試詢問私人婚育隱私並做為篩選門檻是就業歧視，屬於「性別不平等」。'
                    }
                ]
            }
        ];

        // 狀態變數
        let totalScore = 0; // 答對總題數 (滿分 6)
        let completedFlowersCount = 0; // 已完成的花朵數量 (滿分 3)
        let activeFlowerIndex = null;
        let currentModalState = { equal: [], unequal: [], source: [] };
        let draggedCardId = null;

        // 【頁面載入初始化】
        window.onload = function() {
            spawnRandomFlowers();
            setupDropZoneEvents();
        };

        // 【下半部隨機放置 3 朵花圖示】
        function spawnRandomFlowers() {
            const container = document.getElementById('flower-zone');
            container.innerHTML = '';

            // 定義 3 個不重疊的隨機區域（網頁下半部）
            const sectors = [
                { minX: 10, maxX: 32, minY: 20, maxY: 70 },
                { minX: 40, maxX: 60, minY: 25, maxY: 75 },
                { minX: 68, maxX: 88, minY: 20, maxY: 70 }
            ];

            flowerQuestionSets.forEach((set, idx) => {
                const sec = sectors[idx];
                const posX = Math.floor(Math.random() * (sec.maxX - sec.minX + 1)) + sec.minX;
                const posY = Math.floor(Math.random() * (sec.maxY - sec.minY + 1)) + sec.minY;

                const flowerEl = document.createElement('div');
                flowerEl.id = `flower-node-${idx}`;
                flowerEl.className = 'absolute flower-icon flex flex-col items-center group transform -translate-x-1/2 -translate-y-1/2';
                flowerEl.style.left = `${posX}%`;
                flowerEl.style.top = `${posY}%`;
                flowerEl.onclick = () => openQuizModal(idx);

                // 花朵色彩搭配
                let flowerSvgColor = '#ec4899'; // 粉
                if (set.flowerColor === 'yellow') flowerSvgColor = '#eab308';
                if (set.flowerColor === 'purple') flowerSvgColor = '#a855f7';

                flowerEl.innerHTML = `
                    <div class="relative flex flex-col items-center">
                        <!-- 標籤 -->
                        <span class="bg-white/90 text-gray-800 text-xs font-black px-2.5 py-0.5 rounded-full shadow border border-gray-200 mb-1 flex items-center gap-1 group-hover:bg-yellow-300 transition">
                            <i class="fa-solid fa-spa text-pink-500"></i> ${set.flowerName}
                            <span id="flower-status-${idx}" class="text-[10px] text-gray-500 font-normal"></span>
                        </span>

                        <!-- SVG 花朵圖示 -->
                        <div class="w-16 h-16 sm:w-20 sm:h-20 filter drop-shadow-md">
                            <svg viewBox="0 0 100 100" class="w-full h-full">
                                <!-- 莖與葉 -->
                                <path d="M 50 60 Q 45 80 50 100" stroke="#15803d" stroke-width="6" fill="none" stroke-linecap="round"/>
                                <path d="M 50 80 Q 30 75 35 65 Q 48 70 50 80" fill="#22c55e"/>
                                <path d="M 50 85 Q 70 80 65 70 Q 52 75 50 85" fill="#22c55e"/>

                                <!-- 花瓣 -->
                                <g fill="${flowerSvgColor}">
                                    <circle cx="50" cy="30" r="14" />
                                    <circle cx="70" cy="50" r="14" />
                                    <circle cx="50" cy="70" r="14" />
                                    <circle cx="30" cy="50" r="14" />
                                    <circle cx="36" cy="36" r="14" />
                                    <circle cx="64" cy="36" r="14" />
                                    <circle cx="64" cy="64" r="14" />
                                    <circle cx="36" cy="64" r="14" />
                                </g>
                                <!-- 花心 -->
                                <circle cx="50" cy="50" r="13" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
                            </svg>
                        </div>
                    </div>
                `;
                container.appendChild(flowerEl);
            });
        }

        // 【開啟情境 Modal】
        function openQuizModal(setIndex) {
            activeFlowerIndex = setIndex;
            const set = flowerQuestionSets[setIndex];

            // 標籤更新
            document.getElementById('modal-flower-badge').innerText = `${set.flowerName}`;
            
            // 重置回饋區
            const feedbackEl = document.getElementById('quiz-feedback');
            feedbackEl.className = 'hidden p-3.5 rounded-2xl text-sm leading-relaxed';
            document.getElementById('submit-set-btn').disabled = false;
            document.getElementById('submit-set-btn').classList.remove('opacity-50', 'cursor-not-allowed');

            // 初始化狀態
            currentModalState = {
                source: [...set.cards],
                equal: [],
                unequal: []
            };

            renderModalCards();
            document.getElementById('quiz-modal').classList.remove('hidden');
        }

        // 渲染 Modal 內的卡片
        function renderModalCards() {
            const sourceBox = document.getElementById('cards-source-container');
            const equalBox = document.getElementById('drop-zone-equal').querySelector('.drop-card-slot');
            const unequalBox = document.getElementById('drop-zone-unequal').querySelector('.drop-card-slot');

            sourceBox.innerHTML = '';
            equalBox.innerHTML = '';
            unequalBox.innerHTML = '';

            // 渲染待分類卡片
            currentModalState.source.forEach(card => {
                sourceBox.appendChild(createCardElement(card, 'source'));
            });

            // 渲染平等框卡片
            currentModalState.equal.forEach(card => {
                equalBox.appendChild(createCardElement(card, 'equal'));
            });

            // 渲染不平等框卡片
            currentModalState.unequal.forEach(card => {
                unequalBox.appendChild(createCardElement(card, 'unequal'));
            });
        }

        // 建立可拖曳與點擊的卡片 HTML 元素
        function createCardElement(card, currentContainerKey) {
            const el = document.createElement('div');
            el.id = `card-el-${card.id}`;
            el.draggable = true;
            el.className = 'drag-card bg-white p-3 rounded-xl border-2 border-amber-300 shadow-sm text-xs sm:text-sm text-gray-800 font-medium flex flex-col justify-between space-y-2';

            el.innerHTML = `
                <div>${card.text}</div>
                <!-- 輔助快速選擇按鈕（提供觸控與備用快捷操作） -->
                <div class="flex items-center justify-end space-x-1 pt-1 border-t border-gray-100">
                    <span class="text-[10px] text-gray-400 mr-1">移動至：</span>
                    ${currentContainerKey !== 'equal' ? `
                        <button onclick="moveCardDirectly('${card.id}', 'equal')" class="px-2 py-0.5 bg-teal-100 text-teal-800 rounded text-[11px] font-bold hover:bg-teal-200">
                            平等框
                        </button>
                    ` : ''}
                    ${currentContainerKey !== 'unequal' ? `
                        <button onclick="moveCardDirectly('${card.id}', 'unequal')" class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded text-[11px] font-bold hover:bg-rose-200">
                            不平等框
                        </button>
                    ` : ''}
                    ${currentContainerKey !== 'source' ? `
                        <button onclick="moveCardDirectly('${card.id}', 'source')" class="px-2 py-0.5 bg-gray-100 text-gray-700 rounded text-[11px] font-bold hover:bg-gray-200">
                            移回
                        </button>
                    ` : ''}
                </div>
            `;

            // 拖曳事件繫結
            el.ondragstart = (e) => {
                draggedCardId = card.id;
                el.classList.add('dragging');
                e.dataTransfer.setData('text/plain', card.id);
            };
            el.ondragend = () => {
                el.classList.remove('dragging');
            };

            return el;
        }

        // 快捷按鈕移動邏輯
        function moveCardDirectly(cardId, targetZoneKey) {
            let foundCard = null;
            // 尋找卡片並從原陣列移除
            ['source', 'equal', 'unequal'].forEach(key => {
                const idx = currentModalState[key].findIndex(c => c.id === cardId);
                if (idx !== -1) {
                    foundCard = currentModalState[key].splice(idx, 1)[0];
                }
            });

            if (foundCard) {
                currentModalState[targetZoneKey].push(foundCard);
                renderModalCards();
            }
        }

        // 設定拖放放置區 (Drop Zone) 事件
        function setupDropZoneEvents() {
            const zones = [
                document.getElementById('drop-zone-equal'),
                document.getElementById('drop-zone-unequal')
            ];

            zones.forEach(zone => {
                zone.ondragover = (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                };
                zone.ondragleave = () => {
                    zone.classList.remove('drag-over');
                };
                zone.ondrop = (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    const cardId = e.dataTransfer.getData('text/plain') || draggedCardId;
                    const targetKey = zone.getAttribute('data-target');
                    if (cardId && targetKey) {
                        moveCardDirectly(cardId, targetKey);
                    }
                };
            });
        }

        // 重置當前 Modal
        function resetCurrentSetModal() {
            const set = flowerQuestionSets[activeFlowerIndex];
            currentModalState = {
                source: [...set.cards],
                equal: [],
                unequal: []
            };
            document.getElementById('quiz-feedback').classList.add('hidden');
            renderModalCards();
        }

        // 【驗證當前題組答案】
        function checkCurrentSetAnswers() {
            // 檢查是否所有卡片都已分類
            if (currentModalState.source.length > 0) {
                alert('請先將所有情境行為卡片放入「性別平等」或「性別不平等」框中！');
                return;
            }

            const set = flowerQuestionSets[activeFlowerIndex];
            let setCorrectCount = 0;
            let explanationHtml = '';

            // 檢查性別平等框中的卡片
            currentModalState.equal.forEach(card => {
                if (card.correctTarget === 'equal') {
                    setCorrectCount++;
                    explanationHtml += `<div class="text-emerald-800">✓ <strong>【正確】</strong> ${card.explanation}</div>`;
                } else {
                    explanationHtml += `<div class="text-rose-700">✗ <strong>【錯誤】</strong> ${card.text} 應為「性別不平等」。${card.explanation}</div>`;
                }
            });

            // 檢查性別不平等框中的卡片
            currentModalState.unequal.forEach(card => {
                if (card.correctTarget === 'unequal') {
                    setCorrectCount++;
                    explanationHtml += `<div class="text-emerald-800">✓ <strong>【正確】</strong> ${card.explanation}</div>`;
                } else {
                    explanationHtml += `<div class="text-rose-700">✗ <strong>【錯誤】</strong> ${card.text} 應為「性別平等」。${card.explanation}</div>`;
                }
            });

            // 更新累積答對題數
            totalScore += setCorrectCount;
            document.getElementById('score-text').innerText = totalScore;

            // 顯示解析
            const feedbackEl = document.getElementById('quiz-feedback');
            feedbackEl.classList.remove('hidden');
            feedbackEl.className = 'p-3.5 rounded-2xl text-xs sm:text-sm leading-relaxed bg-white border-2 border-emerald-300 space-y-2 shadow-inner';
            feedbackEl.innerHTML = `
                <div class="font-bold text-base text-gray-800 border-b pb-1">
                    本組完成！答對 ${setCorrectCount} / 2 題
                </div>
                ${explanationHtml}
            `;

            // 鎖定按鈕並標記花朵完成
            document.getElementById('submit-set-btn').disabled = true;
            document.getElementById('submit-set-btn').classList.add('opacity-50', 'cursor-not-allowed');

            markFlowerCompleted(activeFlowerIndex, setCorrectCount);
        }

        // 標記花朵完成並檢查是否 6 題全部作答完畢
        function markFlowerCompleted(index, correctInSet) {
            const flowerNode = document.getElementById(`flower-node-${index}`);
            const statusNode = document.getElementById(`flower-status-${index}`);

            if (flowerNode) {
                flowerNode.onclick = null; // 禁止重複作答
                flowerNode.classList.add('flower-completed');
                statusNode.innerText = `(已完成 +${correctInSet})`;
                statusNode.className = "text-[10px] text-emerald-600 font-bold";
            }

            completedFlowersCount++;

            // 關閉 Modal 並在 6 題全完畢時跳出結局
            setTimeout(() => {
                closeQuizModal();
                if (completedFlowersCount === 3) {
                    setTimeout(showEndGameModal, 500);
                }
            }, 2200);
        }

        function closeQuizModal() {
            document.getElementById('quiz-modal').classList.add('hidden');
        }

        // 【結局等級評價彈窗】(規格指定：6題完成顯示於正中間，分等級)
        function showEndGameModal() {
            const modal = document.getElementById('endgame-modal');
            const card = document.getElementById('endgame-card');
            const badgeIcon = document.getElementById('endgame-badge-icon');
            const titleEl = document.getElementById('endgame-level-title');
            const descEl = document.getElementById('endgame-description');
            const scoreVal = document.getElementById('endgame-score-val');
            const actionArea = document.getElementById('endgame-action-area');

            scoreVal.innerText = totalScore;

            /*
              規格判定等級邏輯：
              0-3 題: 再加油 (顯示再次挑戰按鈕)
              4-5 題: 進步中 (顯示再次挑戰按鈕)
              6 題: 平權達人 (顯示下載學習證書按鈕，連結到 certificate.html)
            */

            if (totalScore <= 3) {
                // 等級：再加油
                card.className = "bg-white border-4 border-rose-500 rounded-3xl shadow-2xl max-w-md w-full p-6 text-center modal-animate relative overflow-hidden";
                badgeIcon.className = "w-24 h-24 mx-auto mb-3 rounded-full flex items-center justify-center text-5xl shadow-md border-4 bg-rose-100 text-rose-500 border-rose-300";
                badgeIcon.innerHTML = `<i class="fa-solid fa-seedling"></i>`;
                
                titleEl.innerText = "等級：再加油";
                titleEl.className = "text-3xl font-black mb-2 text-rose-600";
                
                descEl.innerText = "情境歸類中還有一些小觀念混淆囉！別灰心，重新挑戰一次，讓自己更精準掌握性別平等！";
                
                actionArea.innerHTML = `
                    <button onclick="location.reload()" class="w-full bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 text-white font-black py-3.5 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                        <span>再次挑戰</span>
                    </button>
                `;

            } else if (totalScore >= 4 && totalScore <= 5) {
                // 等級：進步中
                card.className = "bg-white border-4 border-amber-500 rounded-3xl shadow-2xl max-w-md w-full p-6 text-center modal-animate relative overflow-hidden";
                badgeIcon.className = "w-24 h-24 mx-auto mb-3 rounded-full flex items-center justify-center text-5xl shadow-md border-4 bg-amber-100 text-amber-500 border-amber-300";
                badgeIcon.innerHTML = `<i class="fa-solid fa-chart-line"></i>`;
                
                titleEl.innerText = "等級：進步中";
                titleEl.className = "text-3xl font-black mb-2 text-amber-600";
                
                descEl.innerText = "表現得相當不錯！您離全對獲得「平權達人」只差最後一哩路囉，快再次挑戰拿滿分吧！";
                
                actionArea.innerHTML = `
                    <button onclick="location.reload()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-black py-3.5 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                        <span>再次挑戰</span>
                    </button>
                `;

            } else {
                // 等級：平權達人 (滿分 6 題)
                card.className = "bg-white border-4 border-emerald-500 rounded-3xl shadow-2xl max-w-md w-full p-6 text-center modal-animate relative overflow-hidden";
                badgeIcon.className = "w-24 h-24 mx-auto mb-3 rounded-full flex items-center justify-center text-5xl shadow-md border-4 bg-emerald-100 text-emerald-600 border-emerald-300 animate-bounce";
                badgeIcon.innerHTML = `<i class="fa-solid fa-award"></i>`;
                
                titleEl.innerText = "等級：平權達人";
                titleEl.className = "text-3xl font-black mb-2 text-emerald-600";
                
                descEl.innerText = "太棒了！您完全精準辨識所有性別平權與歧視情境，恭喜榮獲最高榮譽「平權達人」稱號！";
                
                actionArea.innerHTML = `
                    <a href="certificate.html" class="block w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black py-3.5 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-lg flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-file-arrow-down"></i>
                        <span>下載學習證書</span>
                    </a>
                `;
            }

            modal.classList.remove('hidden');
        }
    </script>
</body>
</html>
